services:
  db:
    build: ./db
    container_name: p5_postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notesdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notesdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: p5_flask_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-notesdb}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-in-production}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-60}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-admin}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
